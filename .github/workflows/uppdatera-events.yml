name: Uppdatera events

on:
  schedule:
    # 04:30 UTC varje dag (06:30 svensk sommartid, 05:30 vintertid)
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Kör tester
        run: npm test

      - name: Bygg events-sv.json
        run: npm run build

      - name: Committa om något ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/events-sv.json docs/raids-sv.json
          if git diff --cached --quiet; then
            echo "Inga ändringar att committa."
          else
            git commit -m "Uppdatera events $(date -u +%F)"
            git push
          fi
